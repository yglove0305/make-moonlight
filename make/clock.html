<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zenith Ultra Timer</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3563/3563457.png">
    
    <!-- Manifest (Embedded via Data URI for single-file portability) -->
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJnameIjogIlplbml0aCBVbHRyYSBUaW1lciIsCiAgInNob3J0X25hbWUiOiAiWmVuaXRoIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwZjE3MmEiLAogICJ0aGVtZV9jb2xvciI6ICIjMjU2M2ViIiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaHR0cHM6Ly9jZG4taWNvbnMtcG5nLmZsYXRpY29uLmNvbS81MTIvMzU2My8zNTYzNDU3LnBuZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIiwKICAgICAgInB1cnBvc2UiOiAiYW55IG1hc2thYmxlIgogICAgfQogIF0KfQ==">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg-deep: #020617;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-bright: #f8fafc;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-bright);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
        }

        .glass-card {
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* Timer Canvas Container */
        .timer-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 0 auto;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .timer-wrapper:hover {
            transform: scale(1.02);
        }

        #mainCanvas {
            width: 100%;
            height: 100%;
        }

        .digital-timer {
            font-family: 'JetBrains+Mono', monospace;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .float-anim { animation: float 6s ease-in-out infinite; }

        .active-tab-nav {
            color: var(--primary) !important;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .tab-panel {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        .tab-panel.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* PWA Install Banner */
        #pwaBanner {
            position: fixed;
            top: env(safe-area-inset-top, 20px);
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
        }

        /* Controls */
        .btn-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-primary:active {
            transform: scale(0.9);
            box-shadow: 0 0 5px var(--primary-glow);
        }

        /* Settings Toggle */
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #334155;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.on { background: var(--primary); }
        .toggle-switch.on::after { transform: translateX(20px); }

        /* To-do Item Style */
        .task-item {
            border-left: 4px solid var(--primary);
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        /* Visualizer Bars */
        .viz-container {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 30px;
        }
        .viz-bar {
            width: 3px;
            background: var(--primary);
            border-radius: 2px;
            transition: height 0.1s;
        }
    </style>
</head>
<body>

    <!-- Background Particle Canvas -->
    <canvas id="bgCanvas" class="fixed top-0 left-0 w-full h-full -z-10"></canvas>

    <!-- PWA Install Banner -->
    <div id="pwaBanner" class="glass glass-card p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center text-white">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div>
                <h4 class="text-xs font-bold">Zenith 설치</h4>
                <p class="text-[10px] text-slate-400 leading-tight">홈 화면에 추가하여 앱처럼 사용하세요</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="pwaClose" class="text-slate-500 text-xs px-2">닫기</button>
            <button id="pwaInstall" class="bg-blue-600 px-4 py-2 rounded-full text-[10px] font-bold">설치</button>
        </div>
    </div>

    <!-- Header -->
    <header class="px-8 pt-12 pb-4 flex justify-between items-center w-full max-w-2xl mx-auto">
        <div class="flex flex-col">
            <span class="text-xs font-bold tracking-[0.3em] text-blue-500 uppercase">Universal System</span>
            <h1 class="text-3xl font-extrabold tracking-tight">Zenith <span class="text-slate-500">v2.5</span></h1>
        </div>
        <div class="flex gap-3">
            <button id="notiBtn" class="w-10 h-10 glass rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button id="settingsBtn" class="w-10 h-10 glass rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main class="flex-grow w-full max-w-2xl mx-auto px-6 overflow-y-auto pb-32">
        
        <!-- Section: TIMER -->
        <section id="timerPanel" class="tab-panel active space-y-8">
            <div class="timer-wrapper float-anim mt-10">
                <canvas id="mainCanvas"></canvas>
                <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                    <div class="viz-container mb-4" id="visualizer"></div>
                    <span id="digitalTime" class="text-6xl font-bold digital-timer">25:00</span>
                    <span id="sessionStatus" class="text-[10px] font-bold tracking-[0.4em] text-slate-500 uppercase mt-2">Deep Focus</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex flex-col items-center gap-8">
                <div class="flex items-center gap-10">
                    <button id="resetTimer" class="btn-circle glass text-slate-400 hover:text-white">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button id="startTimer" class="btn-circle btn-primary text-white text-3xl">
                        <i class="fa-solid fa-play" id="playIcon"></i>
                    </button>
                    <button id="skipTimer" class="btn-circle glass text-slate-400 hover:text-white">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

                <div class="w-full glass glass-card p-6 flex flex-col gap-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold flex items-center gap-2">
                            <i class="fa-solid fa-bolt-lightning text-yellow-400"></i> PRESETS
                        </h3>
                        <span class="text-[10px] text-slate-500">Auto-save enabled</span>
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setTimer(1500)" class="py-3 glass rounded-xl text-[10px] font-bold hover:bg-white/5 transition-all">25M</button>
                        <button onclick="setTimer(3000)" class="py-3 glass rounded-xl text-[10px] font-bold hover:bg-white/5 transition-all">50M</button>
                        <button onclick="setTimer(300)" class="py-3 glass rounded-xl text-[10px] font-bold hover:bg-white/5 transition-all">5M</button>
                        <button onclick="setTimer(900)" class="py-3 glass rounded-xl text-[10px] font-bold hover:bg-white/5 transition-all">15M</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section: TASKS -->
        <section id="tasksPanel" class="tab-panel space-y-6">
            <div class="glass glass-card p-6">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-3">
                    <i class="fa-solid fa-list-check text-blue-500"></i> Active Tasks
                </h2>
                <div class="flex gap-2 mb-6">
                    <input type="text" id="taskInput" placeholder="새로운 작업을 입력하세요..." class="flex-grow bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-blue-500 transition-all">
                    <button id="addTask" class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <div id="taskList" class="space-y-3">
                    <!-- Tasks injected here -->
                </div>
            </div>
        </section>

        <!-- Section: STATS -->
        <section id="statsPanel" class="tab-panel space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="glass glass-card p-6 text-center">
                    <span class="text-[10px] uppercase tracking-widest text-slate-500 mb-2 block">Total Focus</span>
                    <span id="statTotalTime" class="text-2xl font-bold text-blue-400">0h 0m</span>
                </div>
                <div class="glass glass-card p-6 text-center">
                    <span class="text-[10px] uppercase tracking-widest text-slate-500 mb-2 block">Sessions</span>
                    <span id="statSessions" class="text-2xl font-bold text-emerald-400">0</span>
                </div>
            </div>
            <div class="glass glass-card p-6">
                <h3 class="text-sm font-bold mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-purple-400"></i> Weekly Activity
                </h3>
                <div class="relative h-48 w-full">
                    <canvas id="statsChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Section: WORLD -->
        <section id="worldPanel" class="tab-panel space-y-4" id="worldContainer">
            <!-- World Clocks injected here -->
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 w-full glass border-t border-white/10 z-50 px-6 pt-4 pb-8">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <button onclick="switchTab('timer')" class="nav-btn flex flex-col items-center gap-1 text-slate-500 active-tab-nav" id="nav-timer">
                <i class="fa-solid fa-hourglass-half text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Timer</span>
            </button>
            <button onclick="switchTab('tasks')" class="nav-btn flex flex-col items-center gap-1 text-slate-500" id="nav-tasks">
                <i class="fa-solid fa-check-double text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Tasks</span>
            </button>
            <button id="quickAction" class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-blue-500/40 -translate-y-4 border-4 border-slate-900 active:scale-90 transition-transform">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
            <button onclick="switchTab('stats')" class="nav-btn flex flex-col items-center gap-1 text-slate-500" id="nav-stats">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Stats</span>
            </button>
            <button onclick="switchTab('world')" class="nav-btn flex flex-col items-center gap-1 text-slate-500" id="nav-world">
                <i class="fa-solid fa-earth-asia text-lg"></i>
                <span class="text-[9px] font-bold uppercase">World</span>
            </button>
        </div>
    </nav>

    <!-- Settings Sidebar -->
    <div id="settingsSidebar" class="fixed inset-0 z-[100] invisible pointer-events-none transition-all">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity" id="settingsOverlay"></div>
        <div class="absolute right-0 top-0 bottom-0 w-80 glass border-l border-white/10 translate-x-full transition-transform p-8 flex flex-col gap-8" id="settingsContent">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">Preferences</h2>
                <button id="closeSettings" class="text-2xl">&times;</button>
            </div>

            <div class="space-y-6">
                <div class="space-y-4">
                    <label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Audio Experience</label>
                    <div class="flex justify-between items-center">
                        <span class="text-sm">Ticking Sound</span>
                        <div class="toggle-switch" id="toggleTicking"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm">Nature Ambience</span>
                        <div class="toggle-switch" id="toggleNature"></div>
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Visuals</label>
                    <div class="flex justify-between items-center">
                        <span class="text-sm">Dynamic Background</span>
                        <div class="toggle-switch on" id="toggleBg"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm">Glow Effects</span>
                        <div class="toggle-switch on" id="toggleGlow"></div>
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Accent Color</label>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="changeAccent('#3b82f6')" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white/20"></button>
                        <button onclick="changeAccent('#8b5cf6')" class="w-8 h-8 rounded-full bg-purple-500 border-2 border-white/20"></button>
                        <button onclick="changeAccent('#f43f5e')" class="w-8 h-8 rounded-full bg-rose-500 border-2 border-white/20"></button>
                        <button onclick="changeAccent('#10b981')" class="w-8 h-8 rounded-full bg-emerald-500 border-2 border-white/20"></button>
                        <button onclick="changeAccent('#f59e0b')" class="w-8 h-8 rounded-full bg-amber-500 border-2 border-white/20"></button>
                    </div>
                </div>
            </div>

            <div class="mt-auto">
                <button id="pwaSideBtn" class="w-full py-4 bg-blue-600 rounded-2xl font-bold text-sm shadow-lg shadow-blue-500/30 active:scale-95 transition-all">Install to Desktop</button>
                <p class="text-[10px] text-center text-slate-500 mt-4">Zenith Ultra Version 2.5.4 Build 1082</p>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Elements -->
    <audio id="audioAlarm" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="audioNature" loop src="https://assets.mixkit.co/active_storage/sfx/123/123-preview.mp3"></audio>

    <script>
        /**
         * CORE STATE MANAGEMENT
         */
        const state = {
            timer: {
                total: 1500,
                remain: 1500,
                running: false,
                interval: null,
                sessionCount: 0
            },
            tasks: JSON.parse(localStorage.getItem('zenith_tasks') || '[]'),
            stats: JSON.parse(localStorage.getItem('zenith_stats') || '{"totalFocus": 0, "completed": 0, "daily": [12, 45, 30, 0, 0, 0, 0]}'),
            settings: JSON.parse(localStorage.getItem('zenith_settings') || '{"accent": "#3b82f6", "ticking": false, "nature": false, "bg": true, "glow": true}'),
            activeTab: 'timer'
        };

        // Canvas Elements
        const mainCanvas = document.getElementById('mainCanvas');
        const mCtx = mainCanvas.getContext('2d');
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const statsChart = document.getElementById('statsChart');
        const sCtx = statsChart.getContext('2d');

        /**
         * PWA & SERVICE WORKER
         */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'zenith-v1';
                    self.addEventListener('install', (e) => {
                        e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], {type: 'application/javascript'});
                const url = URL.createObjectURL(blob);
                navigator.serviceWorker.register(url).catch(err => console.log('SW registration failed'));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                document.getElementById('pwaBanner').style.display = 'flex';
            }, 5000);
        });

        document.getElementById('pwaInstall').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('pwaBanner').style.display = 'none';
            }
        });

        document.getElementById('pwaClose').addEventListener('click', () => {
            document.getElementById('pwaBanner').style.display = 'none';
        });

        /**
         * INITIALIZATION
         */
        function init() {
            window.addEventListener('resize', resize);
            resize();
            
            // Set initial settings UI
            applySettings();
            
            // Initial Render
            renderTasks();
            renderStats();
            updateTimerDisplay();
            
            // Start Background Anim
            initBgParticles();
            requestAnimationFrame(renderLoop);

            // Clock Update Interval
            setInterval(updateWorldTime, 1000);
            updateWorldTime();
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            
            // Main Canvas
            const mRect = mainCanvas.parentElement.getBoundingClientRect();
            mainCanvas.width = mRect.width * dpr;
            mainCanvas.height = mRect.height * dpr;
            mCtx.scale(dpr, dpr);

            // Background Canvas
            bgCanvas.width = window.innerWidth * dpr;
            bgCanvas.height = window.innerHeight * dpr;
            bgCtx.scale(dpr, dpr);

            // Stats Canvas
            const sRect = statsChart.parentElement.getBoundingClientRect();
            statsChart.width = sRect.width * dpr;
            statsChart.height = sRect.height * dpr;
            sCtx.scale(dpr, dpr);
        }

        /**
         * TIMER LOGIC
         */
        function updateTimerDisplay() {
            const m = Math.floor(state.timer.remain / 60);
            const s = state.timer.remain % 60;
            document.getElementById('digitalTime').textContent = 
                `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (state.timer.running) {
                clearInterval(state.timer.interval);
                state.timer.running = false;
                document.getElementById('playIcon').className = 'fa-solid fa-play';
                document.getElementById('sessionStatus').textContent = 'Session Paused';
                if (state.settings.nature) document.getElementById('audioNature').pause();
            } else {
                state.timer.running = true;
                document.getElementById('playIcon').className = 'fa-solid fa-pause';
                document.getElementById('sessionStatus').textContent = 'Flowing...';
                if (state.settings.nature) document.getElementById('audioNature').play();

                state.timer.interval = setInterval(() => {
                    if (state.timer.remain > 0) {
                        state.timer.remain--;
                        updateTimerDisplay();
                        if (state.settings.ticking) playTick();
                        
                        // Sync visualizer
                        updateVisualizer();
                    } else {
                        completeSession();
                    }
                }, 1000);
            }
        }

        function completeSession() {
            clearInterval(state.timer.interval);
            state.timer.running = false;
            document.getElementById('playIcon').className = 'fa-solid fa-play';
            document.getElementById('audioAlarm').play();
            
            // Update Stats
            state.stats.completed++;
            state.stats.totalFocus += state.timer.total;
            // Update today's daily stat (simple mockup)
            state.stats.daily[new Date().getDay()] += Math.floor(state.timer.total / 60);
            saveData();
            renderStats();

            if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
            
            alert('세션이 완료되었습니다! 고생하셨습니다.');
            resetTimer();
        }

        function setTimer(sec) {
            clearInterval(state.timer.interval);
            state.timer.running = false;
            state.timer.remain = sec;
            state.timer.total = sec;
            document.getElementById('playIcon').className = 'fa-solid fa-play';
            updateTimerDisplay();
        }

        function resetTimer() {
            setTimer(1500);
        }

        function updateVisualizer() {
            const viz = document.getElementById('visualizer');
            viz.innerHTML = '';
            for(let i=0; i<15; i++) {
                const bar = document.createElement('div');
                bar.className = 'viz-bar';
                bar.style.height = `${Math.random() * 25 + 5}px`;
                viz.appendChild(bar);
            }
        }

        /**
         * CANVAS RENDERING ENGINE
         */
        function drawMainTimer() {
            const centerX = 170;
            const centerY = 170;
            const radius = 140;
            const startAngle = -0.5 * Math.PI;
            const progress = 1 - (state.timer.remain / state.timer.total);
            const endAngle = startAngle + (2 * Math.PI * progress);

            mCtx.clearRect(0, 0, 340, 340);

            // Shadow layer
            if (state.settings.glow) {
                mCtx.shadowBlur = 20;
                mCtx.shadowColor = state.settings.accent + '66';
            }

            // Background Circle
            mCtx.beginPath();
            mCtx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            mCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            mCtx.lineWidth = 15;
            mCtx.stroke();

            // Progress Arc
            mCtx.beginPath();
            mCtx.arc(centerX, centerY, radius, startAngle, endAngle);
            mCtx.strokeStyle = state.settings.accent;
            mCtx.lineWidth = 15;
            mCtx.lineCap = 'round';
            mCtx.stroke();

            // Decorative ticks
            mCtx.shadowBlur = 0;
            for(let i=0; i<60; i++) {
                const angle = (i * 6 * Math.PI) / 180 - Math.PI/2;
                const len = i % 5 === 0 ? 15 : 8;
                const x1 = centerX + (radius - 30) * Math.cos(angle);
                const y1 = centerY + (radius - 30) * Math.sin(angle);
                const x2 = centerX + (radius - 30 + len) * Math.cos(angle);
                const y2 = centerY + (radius - 30 + len) * Math.sin(angle);
                
                mCtx.beginPath();
                mCtx.moveTo(x1, y1);
                mCtx.lineTo(x2, y2);
                mCtx.strokeStyle = i / 60 < progress ? state.settings.accent : 'rgba(255,255,255,0.1)';
                mCtx.lineWidth = i % 5 === 0 ? 3 : 1;
                mCtx.stroke();
            }
        }

        const particles = [];
        function initBgParticles() {
            for(let i=0; i<50; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    s: Math.random() * 2 + 1,
                    v: Math.random() * 0.5 + 0.1,
                    o: Math.random() * 0.5 + 0.1
                });
            }
        }

        function drawBackground() {
            if (!state.settings.bg) return;
            bgCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            bgCtx.fillStyle = 'white';
            particles.forEach(p => {
                p.y -= p.v;
                if (p.y < -10) p.y = window.innerHeight + 10;
                bgCtx.globalAlpha = p.o;
                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                bgCtx.fill();
            });
            bgCtx.globalAlpha = 1.0;
        }

        function drawStats() {
            if (state.activeTab !== 'stats') return;
            const w = statsChart.width / (window.devicePixelRatio || 1);
            const h = 192;
            sCtx.clearRect(0, 0, w, h);

            const data = state.stats.daily;
            const max = Math.max(...data, 60);
            const barW = (w - 40) / 7;

            data.forEach((val, i) => {
                const barH = (val / max) * (h - 60);
                const x = 20 + i * barW;
                const y = h - 40 - barH;

                const grad = sCtx.createLinearGradient(0, y, 0, h - 40);
                grad.addColorStop(0, state.settings.accent);
                grad.addColorStop(1, state.settings.accent + '22');

                sCtx.fillStyle = grad;
                sCtx.beginPath();
                sCtx.roundRect(x + 5, y, barW - 10, barH, [10, 10, 0, 0]);
                sCtx.fill();

                sCtx.fillStyle = '#64748b';
                sCtx.font = '10px Outfit';
                sCtx.textAlign = 'center';
                const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
                sCtx.fillText(days[i], x + barW / 2, h - 15);
            });
        }

        function renderLoop() {
            drawMainTimer();
            drawBackground();
            if (state.activeTab === 'stats') drawStats();
            requestAnimationFrame(renderLoop);
        }

        /**
         * TASK MANAGEMENT
         */
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = state.tasks.length ? '' : '<p class="text-center text-slate-500 py-10">작업이 없습니다.</p>';
            
            state.tasks.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'task-item glass p-4 rounded-2xl flex justify-between items-center';
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <button onclick="toggleTask(${i})" class="w-6 h-6 rounded-full border-2 ${t.done ? 'bg-blue-500 border-blue-500' : 'border-white/20'} flex items-center justify-center">
                            ${t.done ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                        </button>
                        <span class="${t.done ? 'line-through text-slate-500' : 'text-slate-200'} text-sm">${t.text}</span>
                    </div>
                    <button onclick="deleteTask(${i})" class="text-slate-600 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            state.tasks.unshift({ text: input.value, done: false });
            input.value = '';
            saveData();
            renderTasks();
        }

        window.toggleTask = (i) => {
            state.tasks[i].done = !state.tasks[i].done;
            saveData();
            renderTasks();
        };

        window.deleteTask = (i) => {
            state.tasks.splice(i, 1);
            saveData();
            renderTasks();
        };

        /**
         * WORLD CLOCK
         */
        const worldZones = [
            { name: 'Seoul', zone: 'Asia/Seoul' },
            { name: 'London', zone: 'Europe/London' },
            { name: 'New York', zone: 'America/New_York' },
            { name: 'Tokyo', zone: 'Asia/Tokyo' },
            { name: 'Paris', zone: 'Europe/Paris' }
        ];

        function updateWorldTime() {
            if (state.activeTab !== 'world') return;
            const container = document.getElementById('worldPanel');
            container.innerHTML = '<h2 class="text-xl font-bold mb-4">World Engine</h2>';
            
            worldZones.forEach(z => {
                const now = new Date();
                const time = now.toLocaleTimeString('ko-KR', { timeZone: z.zone, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const date = now.toLocaleDateString('en-US', { timeZone: z.zone, month: 'short', day: 'numeric' });
                
                const div = document.createElement('div');
                div.className = 'glass glass-card p-5 flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold">${z.name}</h4>
                        <span class="text-[10px] text-slate-500">${date}</span>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-bold digital-timer text-blue-400">${time}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        /**
         * UI CONTROLS & EVENTS
         */
        function switchTab(tabId) {
            state.activeTab = tabId;
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab-nav'));
            
            document.getElementById(`${tabId}Panel`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active-tab-nav');
            
            if (tabId === 'stats') renderStats();
            if (tabId === 'world') updateWorldTime();
        }

        function renderStats() {
            const totalH = Math.floor(state.stats.totalFocus / 3600);
            const totalM = Math.floor((state.stats.totalFocus % 3600) / 60);
            document.getElementById('statTotalTime').textContent = `${totalH}h ${totalM}m`;
            document.getElementById('statSessions').textContent = state.stats.completed;
            drawStats();
        }

        // Settings Sidebar
        document.getElementById('settingsBtn').addEventListener('click', () => {
            const sb = document.getElementById('settingsSidebar');
            sb.classList.remove('invisible');
            sb.querySelector('#settingsOverlay').classList.add('opacity-100');
            sb.querySelector('#settingsContent').classList.remove('translate-x-full');
        });

        const closeSidebar = () => {
            const sb = document.getElementById('settingsSidebar');
            sb.querySelector('#settingsOverlay').classList.remove('opacity-100');
            sb.querySelector('#settingsContent').classList.add('translate-x-full');
            setTimeout(() => sb.classList.add('invisible'), 300);
        };
        document.getElementById('closeSettings').addEventListener('click', closeSidebar);
        document.getElementById('settingsOverlay').addEventListener('click', closeSidebar);

        // Toggles
        function setupToggle(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('click', () => {
                state.settings[key] = !state.settings[key];
                el.classList.toggle('on');
                saveData();
                applySettings();
            });
            if (state.settings[key]) el.classList.add('on');
        }
        setupToggle('toggleTicking', 'ticking');
        setupToggle('toggleNature', 'nature');
        setupToggle('toggleBg', 'bg');
        setupToggle('toggleGlow', 'glow');

        window.changeAccent = (color) => {
            state.settings.accent = color;
            applySettings();
            saveData();
        };

        function applySettings() {
            document.documentElement.style.setProperty('--primary', state.settings.accent);
            document.documentElement.style.setProperty('--primary-glow', state.settings.accent + '88');
            
            // Audio check
            const nature = document.getElementById('audioNature');
            if (state.settings.nature && state.timer.running) nature.play();
            else nature.pause();
        }

        function playTick() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function saveData() {
            localStorage.setItem('zenith_tasks', JSON.stringify(state.tasks));
            localStorage.setItem('zenith_stats', JSON.stringify(state.stats));
            localStorage.setItem('zenith_settings', JSON.stringify(state.settings));
        }

        // Timer Controls
        document.getElementById('startTimer').addEventListener('click', toggleTimer);
        document.getElementById('resetTimer').addEventListener('click', resetTimer);
        document.getElementById('skipTimer').addEventListener('click', completeSession);
        document.getElementById('addTask').addEventListener('click', addTask);
        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') addTask();
        });

        // App Start
        init();

    </script>
</body>
</html>
